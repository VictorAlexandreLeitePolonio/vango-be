<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" fill="none">
  <defs>
    <linearGradient id="vanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F7931E"/>
      <stop offset="100%" stop-color="#FDB813"/>
    </linearGradient>
  </defs>
  <!-- Van icon -->
  <g transform="translate(0, 10)">
    <!-- Van body -->
    <rect x="5" y="18" width="52" height="30" rx="6" fill="url(#vanGrad)"/>
    <!-- Windshield -->
    <path d="M42 18 L57 18 Q60 18 60 21 L60 35 L42 35 Z" fill="#FFF8F0" opacity="0.9"/>
    <!-- Side window -->
    <rect x="10" y="23" width="14" height="12" rx="3" fill="#FFF8F0" opacity="0.85"/>
    <rect x="27" y="23" width="12" height="12" rx="3" fill="#FFF8F0" opacity="0.85"/>
    <!-- Roof rack -->
    <rect x="8" y="14" width="34" height="5" rx="2.5" fill="#E07B0A"/>
    <!-- Wheels -->
    <circle cx="18" cy="50" r="7" fill="#1A1A2E"/>
    <circle cx="18" cy="50" r="3.5" fill="#6B7280"/>
    <circle cx="47" cy="50" r="7" fill="#1A1A2E"/>
    <circle cx="47" cy="50" r="3.5" fill="#6B7280"/>
    <!-- Headlight -->
    <rect x="55" y="30" width="5" height="6" rx="2" fill="#FDB813"/>
    <!-- Ground line -->
    <line x1="3" y1="57" x2="62" y2="57" stroke="#E5E7EB" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- VanGo text -->
  <text x="78" y="52" font-family="Poppins, sans-serif" font-size="38" font-weight="700" fill="url(#vanGrad)">
    Van<tspan fill="#1A1A2E">Go</tspan>
  </text>
</svg>
